name: Deploy lens-proxy worker

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Only one deploy in flight at a time — newer pushes cancel an older one.
concurrency:
  group: lens-proxy-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build worker (inline src/* as base64)
        env:
          BUILD_TIMESTAMP: ${{ github.event.repository.updated_at }}
        run: python3 scripts/build-worker.py

      - name: Deploy to Cloudflare Workers
        env:
          CF_EMAIL:   ${{ secrets.CF_EMAIL }}
          CF_KEY:     ${{ secrets.CF_KEY }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
        run: |
          test -n "$CF_EMAIL"   || { echo "::error::missing CF_EMAIL secret";   exit 1; }
          test -n "$CF_KEY"     || { echo "::error::missing CF_KEY secret";     exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::missing CF_ACCOUNT secret"; exit 1; }
          curl -fsS -X PUT \
            -H "X-Auth-Email: $CF_EMAIL" \
            -H "X-Auth-Key: $CF_KEY" \
            -F 'metadata={"body_part":"script","compatibility_date":"2025-01-01"};type=application/json' \
            -F "script=@dist/worker.js;type=application/javascript" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/lens-proxy" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('deploy success:', d.get('success'))"

      - name: Verify deploy (via CF API — edge is firewalled to GH Actions IPs)
        env:
          CF_EMAIL:   ${{ secrets.CF_EMAIL }}
          CF_KEY:     ${{ secrets.CF_KEY }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
        run: |
          curl -fsS -H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_KEY" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts" \
            | python3 -c "
import json, os, sys, datetime as dt
d = json.load(sys.stdin)
script = next((s for s in d.get('result', []) if s['id'] == 'lens-proxy'), None)
assert script, 'lens-proxy script not found'
modified = script.get('modified_on')
age = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(modified)).total_seconds()
print(f'lens-proxy modified_on={modified}  ({age:.0f}s ago)')
assert age < 300, f'modified_on is {age:.0f}s old; this run did not deploy a fresh script'
"
          # End-user smoke (browser → edge) is run manually; CF firewall blocks
          # GH Actions IPs unconditionally on this zone.
