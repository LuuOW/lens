name: Deploy lens to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate healthz.json
        run: |
          cat > src/healthz.json <<EOF
          {"ok":true,"name":"lens","host":"github-pages","commit":"${GITHUB_SHA:0:7}","run_id":"${GITHUB_RUN_ID}","built_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF

      - name: Cache-bust ALL module URLs with commit SHA
        run: |
          sha="${GITHUB_SHA:0:7}"
          # Rewrite __BUILD_SHA__ in every file that imports a sibling
          # module — index.html for the script tag plus the .js/.mjs
          # files for their relative imports. Each commit becomes a
          # fresh set of URLs across the bundle so no Safari disk-cache
          # entry from an earlier commit can survive.
          for f in src/index.html src/index.js src/gh-models.mjs src/orbital.mjs; do
            sed -i "s|__BUILD_SHA__|${sha}|g" "$f"
          done
          grep -q "index.js?v=${sha}" src/index.html
          grep -q "vlm.mjs?v=${sha}" src/index.js
          grep -q "orbital.mjs?v=${sha}" src/gh-models.mjs
          grep -q "tokenize.mjs?v=${sha}" src/orbital.mjs
          echo "✓ all asset URLs at ${sha}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./src

      - id: deployment
        uses: actions/deploy-pages@v4
